name: Sync MLB schedule (manual)

# Scheduling moved to Vercel Cron (see vercel.json, "0 9 * * *") — GH
# Actions' own `schedule:` trigger was confirmed to silently not fire at
# all for a full day+, so it's no longer relied on for cadence. Kept here
# as a manual fallback (Actions tab or `gh workflow run sync-schedule.yml`).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync schedule
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/sync-schedule" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
