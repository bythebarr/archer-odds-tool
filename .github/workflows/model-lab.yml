name: Model lab (backtests and fits)

# Runs a model backtest or fit against the production database, prints the
# report, and saves each report card for the in-app /models page —
# every model's accuracy, calibration and fitted constants come from here, not
# from guesses. "report:all" runs every model. Needs a DATABASE_URL repository secret (Settings →
# Secrets and variables → Actions). The scripts only write their own report cards (ModelReport),
# except import:tennis (loads the free Sackmann archive + Elo ratings), diagnose:props and diagnose:parlays (read-only)
# and fix:ufc-duplicates (dry run; the :apply choice merges UFC fights stored twice).
# Keeps the database awake for the run (a few minutes), so run it on purpose.
on:
  # Weekly refresh of every report card (Monday morning ET). GitHub's scheduler
  # can skip a run; the manual trigger below always works.
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      script:
        description: "Which report"
        required: true
        type: choice
        default: "report:all"
        options:
          - report:all
          - fit:ufc-prior
          - fit:ufc-props
          - backtest:nba-props
          - backtest:nfl-props
          - backtest:props-market
          - backtest:games
          - backtest:ufc-fights
          - backtest:f1
          - backtest:mlb-props
          - backtest:ufc
          - backtest:nfl
          - backtest:nfl:clv
          - backtest:all
          - backtest:all-sports
          - backtest:soccer-props
          - backtest:soccer
          - backtest:tennis
          - import:tennis
          - diagnose:props
          - diagnose:parlays
          - poll:espn-props
          - fix:ufc-duplicates
          - fix:ufc-duplicates:apply
      n:
        description: "Sample size (N), where the script takes one"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run ${{ inputs.script || 'report:all' }}
        env:
          N: ${{ inputs.n || '' }}
          # Saves each report card for the in-app /models page.
          SAVE_REPORT: "1"
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add a DATABASE_URL repository secret first."; exit 1; fi
          [ -z "$N" ] && unset N
          if [ "${{ inputs.script || 'report:all' }}" = "report:all" ]; then
            # Every model's report card; one failing doesn't stop the rest.
            status=0
            for s in backtest:all backtest:nba-props backtest:nfl-props backtest:props-market backtest:games backtest:ufc-fights backtest:f1 backtest:mlb-props; do
              echo "::group::$s"; npm run --silent "$s" || status=1; echo "::endgroup::"
            done
            exit $status
          fi
          npm run --silent "${{ inputs.script || 'report:all' }}"
