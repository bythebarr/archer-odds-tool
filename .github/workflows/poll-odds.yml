name: Poll odds (manual — costs Odds API credits)

# Scheduling moved to Vercel Cron (see vercel.json) — GH Actions' own
# `schedule:` trigger was confirmed to silently not fire at all for a full
# day+ (no error, no run, nothing), so it's no longer relied on for cadence.
# This workflow is now manual-only: a fallback you can run by hand from the
# Actions tab (or `gh workflow run poll-odds.yml`) if you ever need to force
# a poll outside Vercel's own 2x/day schedule (14:05 and 22:30 UTC).
on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Sync today's game statuses/scores (free)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/sync-results" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Poll odds (throttled, costs credits)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/poll-odds" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Grade newly-final games (free)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/grade-outcomes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
