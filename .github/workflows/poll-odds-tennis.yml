name: Poll tennis odds (manual — costs Odds API credits)

# Scheduling moved to Vercel Cron (see vercel.json) — GH Actions' own
# `schedule:` trigger was confirmed to silently not fire at all for a full
# day+, so it's no longer relied on for cadence. Kept here as a manual
# fallback (Actions tab or `gh workflow run poll-odds-tennis.yml`).
on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll tennis odds (credit-throttled, allowlisted tournament only)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/poll-odds-tennis" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # There is deliberately NO grading step here. Tennis grading used to run
      # off /scores, which our provider does not serve for tennis (zero results
      # for ATP and WTA, measured twice — see docs/architecture/provider-coverage.md),
      # so it spent credits every other day to grade nothing. Tennis is
      # signal-only until it has a results source; see SportMeta.signalOnly.
