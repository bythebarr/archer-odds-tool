name: Sync scores & grade outcomes (free)

on:
  schedule:
    # Every 15 minutes. The first two steps hit only the free MLB Stats API /
    # read already-stored odds history — no Odds API credits are ever spent.
    # The third step (MLB odds refresh) is DORMANT: it runs only once the repo
    # variable ODDS_FRESH_ENABLED is set to "true", which should happen only
    # AFTER upgrading the Odds API to a paid tier. When enabled, the poller's
    # own tier policy self-throttles the real cadence around game time.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync today's game statuses/scores (free)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/sync-results" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Grade newly-final games (free)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/grade-outcomes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # ── MLB odds freshness ─────────────────────────────────────────────────
      # This TICKS the poller; it does not force a fetch. /api/cron/poll-odds
      # runs decidePollOdds first, which self-throttles by proximity to first
      # pitch (60 min far / 20 approaching / 5 imminent) and refuses outright on
      # low credits. So a frequent tick costs nothing extra — it just lets that
      # policy do the job it was written for.
      #
      # It was gated behind ODDS_FRESH_ENABLED back when odds credits were the
      # scarce thing. After the ParlayAPI switch a poll is 6 credits and props
      # got 48x cheaper, while the gate quietly left game lines refreshing TWICE
      # A DAY — a 7pm game priced off a 9:30am snapshot, which reads as "the odds
      # are wrong" because by then they are.
      - name: Refresh MLB odds (ticks the self-throttling poller)
        run: |
          curl -sfL -X POST "${{ secrets.APP_URL }}/api/cron/poll-odds" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
