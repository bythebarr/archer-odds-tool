name: Refresh now (schedule, scores, odds)

# Manual only. This used to run every 15 minutes, and every run wakes the
# database: that kept a scale-to-zero Postgres awake around the clock and used
# up the database plan's compute quota on 2026-10-14, which took the site down.
# Vercel Cron runs these in clustered windows (see vercel.json); this is the
# button for "refresh it now": it prints the site's health, then runs the NBA
# and NFL results syncs (free — they also refresh each league's schedule from
# ESPN) and the NBA odds poll (spends odds credits; self-throttled to one poll
# per 50 minutes).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Read-only health probe, printed to the log, so a failure below shows its reason.
      - name: Site health (read-only)
        if: always()
        run: |
          for path in /api/health /api/status; do
            echo "== GET $path"
            curl -sS -L -o /tmp/body -w "HTTP %{http_code}\n" "${{ secrets.APP_URL }}$path" || true
            head -c 1500 /tmp/body; echo
          done

      - name: NBA schedule, scores and game logs (free)
        if: always()
        run: |
          curl -sSL --fail-with-body -X POST "${{ secrets.APP_URL }}/api/cron/sync-results-nba" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 2000; echo

      - name: NFL schedule and scores (free)
        if: always()
        run: |
          curl -sSL --fail-with-body -X POST "${{ secrets.APP_URL }}/api/cron/sync-results-nfl" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 2000; echo

      - name: NBA odds and props (spends credits)
        if: always()
        run: |
          curl -sSL --fail-with-body -X POST "${{ secrets.APP_URL }}/api/cron/poll-odds-nba" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 2000; echo
